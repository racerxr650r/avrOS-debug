name: CI — Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Run inside Debian 13 (trixie) so the AVR toolchain matches the developer /
    # hardware environment (avr-gcc 14.2 + avr-libc 2.2 with native AVR-Dx
    # support).  ubuntu-latest's distro gcc-avr is 5.x, whose different DWARF
    # line tables break the fixture-derived DWARF tests.
    container: debian:trixie
    permissions:
      pull-requests: write   # post / update the PR comment

    steps:
      # Install deps before checkout so git is present in the container.
      # Root in the container — no sudo; avr-libc 2.2 covers AVR-Dx so no DFP.
      - name: Install build dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            make gcc binutils gcc-avr binutils-avr avr-libc \
            libdw-dev libelf-dev git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      # Run every test suite; write per-suite output to build/test-results/.
      # continue-on-error keeps subsequent steps running so we always post a
      # summary even when tests fail.
      - name: Build and run tests
        id: run_tests
        run: make test-ci
        continue-on-error: true

      # Upload raw test-result files as a workflow artifact.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          retention-days: 7

      # Parse Unity output, write the Actions step summary, and post (or
      # update) a single sticky comment on the PR.
      - name: Post test summary
        uses: actions/github-script@v7
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.run_tests.outcome }}
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const resultsDir = 'build/test-results';
            let files;
            try {
              files = fs.readdirSync(resultsDir)
                        .filter(f => f.endsWith('.txt'))
                        .sort();
            } catch (_) {
              files = [];
            }

            let totalTests = 0, totalFail = 0, totalIgnored = 0;
            const rows        = [];
            const failDetails = [];

            for (const file of files) {
              const suite = file.replace('.txt', '');
              const raw   = fs.readFileSync(path.join(resultsDir, file), 'utf8');

              // Unity summary line: "N Tests M Failures K Ignored"
              const m = raw.match(/(\d+) Tests (\d+) Failures (\d+) Ignored/);
              if (!m) {
                rows.push(`| \`${suite}\` | ❓ | — | — | — |`);
                continue;
              }

              const [t, f, i] = [m[1], m[2], m[3]].map(Number);
              totalTests   += t;
              totalFail    += f;
              totalIgnored += i;

              rows.push(
                `| \`${suite}\` | ${f > 0 ? '❌' : '✅'} ` +
                `| ${t - f - i} | ${f} | ${i} |`
              );

              if (f > 0) {
                const lines = raw.split('\n')
                  .filter(l => /:FAIL:/.test(l))
                  .map(l => `  - \`${l.trim()}\``);
                failDetails.push(`**\`${suite}\`**\n${lines.join('\n')}`);
              }
            }

            const passed = totalTests - totalFail - totalIgnored;
            const allOk  = process.env.TESTS_OUTCOME === 'success';
            const badge  = allOk ? '✅ All tests passed' : '❌ Tests failed';
            const sha    = context.payload.pull_request.head.sha.slice(0, 7);

            let md = `## Test Results\n\n`;
            if (files.length === 0) {
              md += `⚠️ No test-result files found — the build may have failed before any suite ran.\n`;
            } else {
              md += `${badge} — **${passed} / ${totalTests}** passed`;
              if (totalIgnored > 0) md += `, ${totalIgnored} ignored`;
              md += ` (commit \`${sha}\`)\n\n`;
              md += `| Suite | Status | Passed | Failed | Ignored |\n`;
              md += `| --- | :---: | ---: | ---: | ---: |\n`;
              md += rows.join('\n') + '\n';
              if (failDetails.length > 0) {
                md += `\n### Failures\n\n${failDetails.join('\n\n')}\n`;
              }
            }

            // Write to the Actions job summary page
            await core.summary.addRaw(md).write();

            // Post or update a single sticky PR comment
            const marker = '<!-- aod-ci-test-summary -->';
            const body   = `${marker}\n${md}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Propagate the test failure so the PR check is red when tests fail.
      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "One or more test suites failed — see the PR comment for details."
          exit 1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Same Debian-trixie toolchain as the unit-tests job (see note above).
    container: debian:trixie
    permissions:
      pull-requests: write   # post / update the PR comment

    steps:
      # Install deps before checkout so git is present in the container.
      - name: Install build dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            make gcc binutils gcc-avr binutils-avr avr-libc \
            libdw-dev libelf-dev gcovr git ca-certificates
          gcovr --version

      - name: Checkout
        uses: actions/checkout@v4

      # Build with --coverage, run every unit test suite, and emit
      # line + branch coverage reports under build/coverage/. The
      # coverage target itself runs `make test-ci COVERAGE=1`, so
      # test failures here will also fail the coverage job.
      - name: Build and run with coverage
        id: run_coverage
        run: make coverage
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/
          retention-days: 14

      - name: Post coverage summary
        if: always()
        uses: actions/github-script@v7
        env:
          COVERAGE_OUTCOME: ${{ steps.run_coverage.outcome }}
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const summaryPath = 'build/coverage/coverage.json';
            let data = null;
            try {
              data = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            } catch (e) {
              data = null;
            }

            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const ok  = process.env.COVERAGE_OUTCOME === 'success';

            const pct = (v) =>
              (v === undefined || v === null) ? '—' : `${Number(v).toFixed(1)}%`;
            const ratio = (c, t) =>
              (c === undefined || t === undefined) ? '—' : `${c} / ${t}`;

            // Health badge based on branch coverage
            function badge(p) {
              if (p === undefined || p === null) return '⚠️';
              if (p >= 80) return '✅';
              if (p >= 60) return '🟡';
              return '🔴';
            }

            let md = `## Code Coverage\n\n`;
            if (!ok) {
              md += `❌ Coverage build failed — see the workflow log for details.\n\n`;
            }
            if (!data) {
              md += `⚠️ No coverage report was produced (commit \`${sha}\`).\n`;
            } else {
              md += `Commit \`${sha}\` — instrumented with \`--coverage\` and \`gcovr\`.\n\n`;
              md += `| Metric | Covered | Percent |\n`;
              md += `| --- | ---: | ---: |\n`;
              md += `| Lines     | ${ratio(data.line_covered, data.line_total)}         | ${badge(data.line_percent)} ${pct(data.line_percent)} |\n`;
              md += `| **Branches** | ${ratio(data.branch_covered, data.branch_total)} | ${badge(data.branch_percent)} ${pct(data.branch_percent)} |\n`;
              md += `| Functions | ${ratio(data.function_covered, data.function_total)} | ${badge(data.function_percent)} ${pct(data.function_percent)} |\n\n`;

              const files = (data.files || [])
                .slice()
                .sort((a, b) => a.filename.localeCompare(b.filename));
              if (files.length > 0) {
                md += `<details><summary>Per-file coverage</summary>\n\n`;
                md += `| File | Lines | Branches | Functions |\n`;
                md += `| --- | ---: | ---: | ---: |\n`;
                for (const f of files) {
                  md += `| \`${f.filename}\` ` +
                        `| ${pct(f.line_percent)} (${f.line_covered}/${f.line_total}) ` +
                        `| ${badge(f.branch_percent)} ${pct(f.branch_percent)} (${f.branch_covered}/${f.branch_total}) ` +
                        `| ${pct(f.function_percent)} (${f.function_covered}/${f.function_total}) |\n`;
                }
                md += `\n</details>\n`;
              }
              md += `\n[Full HTML report available as the \`coverage-report\` artifact on this workflow run.]\n`;
            }

            // Write to the Actions job summary page
            await core.summary.addRaw(md).write();

            // Post or update a single sticky PR comment
            const marker = '<!-- aod-ci-coverage-summary -->';
            const body   = `${marker}\n${md}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Propagate coverage-build failure so the PR check turns red.
      - name: Fail job if coverage failed
        if: steps.run_coverage.outcome == 'failure'
        run: |
          echo "Coverage build / test run failed — see the PR comment for details."
          exit 1
