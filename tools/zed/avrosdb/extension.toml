id = "avrosdb"
name = "avrOSdb (DAP)"
version = "0.1.0"
schema_version = 1
authors = ["John Anderson <racerxr650r@gmail.com>"]
description = "Debug AVR-Dx targets in Zed via `avrOSdb --dap` — one action launches the server and attaches over the Debug Adapter Protocol."
repository = "https://github.com/racerxr650r/avrOS-debug"

# Registers the `avrosdb` debug adapter. The configuration schema lives at the
# default location debug_adapter_schemas/avrosdb.json (see schema_path below),
# and powers completion/validation of `.zed/debug.json` entries.
[debug_adapters.avrosdb]
schema_path = "debug_adapter_schemas/avrosdb.json"
